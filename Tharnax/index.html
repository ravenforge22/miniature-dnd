        .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin: 20px 0; border-bottom: 2px solid #d4c4a8; padding-bottom: 10px; }
        .tab-btn { background: #e8dccc; color: #2c1810; border: none; padding: 10px 20px; border-radius: 30px 30px 0 0; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 13px; }

        .footer { text-align: center; padding: 18px; background: #e8dccc; font-size: 11px; color: #5a4a3a; border-top: 1px solid #d4c4a8; }

    // ========================================
    // CALCOLO MODIFICATORE (D&D 5e)
    // ========================================
    function calcolaMod(punteggio) {
        const val = parseInt(punteggio, 10);
        if (isNaN(val)) return 0;
        return Math.floor((val - 10) / 2);
    }

    // ========================================
    // INDICATORE DI STATO
    // ========================================
    function mostraStato(testo, durata = 1500) {
        const el = document.getElementById("sync-status");
        if (!el) return;
        el.textContent = testo;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), durata);
    }

    // ========================================
    // JSONP
    // ========================================
    function jsonpRequest(url, callbackName, onSuccess, onError) {
        const script = document.createElement('script');
        const callbackFunction = `jsonp_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;

        window[callbackFunction] = function(data) {
            delete window[callbackFunction];
            if (script.parentNode) document.body.removeChild(script);
            onSuccess(data);
        };

        const separator = url.includes('?') ? '&' : '?';
        script.src = `${url}${separator}callback=${callbackFunction}`;
        script.onerror = () => {
            delete window[callbackFunction];
            if (script.parentNode) document.body.removeChild(script);
            if (onError) onError();
        };

        document.body.appendChild(script);
    }

        const url = `${URL_BACKUP}?azione=backup&id=${ID_MINIATURA}&dati=${encodeURIComponent(JSON.stringify(daSalvare))}`;

        return new Promise((resolve) => {
            jsonpRequest(url, 'callback', (data) => {
                console.log("Backup risultato:", data);
                mostraStato("✅ Salvato sul server");
                resolve();
            }, () => {
                console.log("Errore backup");
                mostraStato("⚠️ Offline - salvato solo in locale");
                resolve();
            });
        });
    }

    async function recuperaBackup() {
        if (URL_BACKUP.includes("IL_TUO_SCRIPT_ID")) return null;
        const url = `${URL_BACKUP}?azione=recupera&id=${ID_MINIATURA}`;

        return new Promise((resolve) => {
            jsonpRequest(url, 'callback', (data) => {
                console.log("Risposta server:", data);
                if (data && data.status !== "nessun_backup" && data.status !== "error") {
                    resolve(data);
                } else {
                    resolve(null);
                }
            }, () => {
                console.warn("Errore JSONP nel recupero backup");
                resolve(null);
            });
        });
    }

    function salvaLocale() {
        try {
            localStorage.setItem(`pg_${ID_MINIATURA}`, JSON.stringify(dati));
        } catch (e) {
            console.warn("Impossibile salvare in localStorage:", e);
        }
    }

    let backupTimer = null;
    function pianificaBackup() {
        if (backupTimer) clearTimeout(backupTimer);
        mostraStato("💾 Salvataggio...", 2000);
        backupTimer = setTimeout(() => {
            salvaBackup();
        }, 1200);
    }

    function salvaTutto() {
        salvaLocale();
        pianificaBackup();
    }

    function salvaCampo(campo, valore) {
        dati[campo] = valore;
        salvaTutto();
    }

    function salvaCaratteristica(campo, valore) {
        dati[campo] = valore;
        salvaTutto();
        aggiornaModificatori();
    }

    function aggiornaModificatori() {
        const mappa = { forza: 'mod-forza', destrezza: 'mod-destrezza', costituzione: 'mod-costituzione', intelligenza: 'mod-intelligenza', saggezza: 'mod-saggezza', carisma: 'mod-carisma' };
        for (const [campo, idEl] of Object.entries(mappa)) {
            const el = document.getElementById(idEl);
            if (el) {
                const m = calcolaMod(dati[campo]);
                el.textContent = `(${m >= 0 ? '+' : ''}${m})`;
            }
        }
    }

    async function setLingua(lingua) {
        linguaCorrente = lingua;
        dati.lingua = lingua;
        salvaTutto();
        disegnaPagina();
    }

    function switchTab(tabId) {
        const panes = document.querySelectorAll('.tab-pane');
        const btns = document.querySelectorAll('.tab-btn');
        panes.forEach(pane => pane.classList.remove('active'));
        btns.forEach(btn => btn.classList.remove('active'));
        const targetPane = document.getElementById(`tab-${tabId}`);
        const targetBtn = document.getElementById(`btn-${tabId}`);
        if (targetPane) targetPane.classList.add('active');
        if (targetBtn) targetBtn.classList.add('active');
    }

    function abilitaModificaLore() {
        const testo = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;
        const textarea = document.getElementById("lore-textarea");
        const loreTesto = document.getElementById("lore-testo");
        const btnMod = document.getElementById("btn-modifica-lore");
        const btnSalva = document.getElementById("btn-salva-lore");
        if (textarea) { textarea.value = testo; textarea.style.display = "block"; }
        if (loreTesto) loreTesto.style.display = "none";
        if (btnMod) btnMod.style.display = "none";
        if (btnSalva) btnSalva.style.display = "inline-block";
    }

    function salvaLore() {
        const textarea = document.getElementById("lore-textarea");
        if (!textarea) return;
        const nuovo = textarea.value;
        if (linguaCorrente === "it") { dati.lore_ita = nuovo; } else { dati.lore_eng = nuovo; }
        salvaTutto();
        disegnaPagina();
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    // ========================================
    // CARICAMENTO
    // ========================================
    async function caricaDati() {
        try {
            console.log("🔄 Avvio caricamento...");

            const localiRaw = localStorage.getItem(`pg_${ID_MINIATURA}`);
            const datiLocali = localiRaw ? JSON.parse(localiRaw) : null;
            console.log("💾 Locale presente:", datiLocali ? "SÌ" : "NO");

            if (datiLocali && Object.keys(datiLocali).length > 5) {
                dati = datiLocali;
                linguaCorrente = dati.lingua || "it";
                disegnaPagina();
                console.log("✅ Disegnato subito dal LOCALE");
            }

            let backup = null;
            try {
                backup = await Promise.race([
                    recuperaBackup(),
                    new Promise(resolve => setTimeout(() => resolve("TIMEOUT"), 8000))
                ]);
                if (backup === "TIMEOUT") { console.warn("⚠️ Timeout backup"); backup = null; }
            } catch (err) { console.warn("⚠️ Errore backup:", err); backup = null; }
            console.log("📥 Backup ricevuto:", backup ? "SÌ" : "NO");

            if (backup) {
                const t_backup = backup._ultimaModifica || 0;
                const t_locale = datiLocali ? (datiLocali._ultimaModifica || 0) : 0;
                if (!datiLocali || t_backup > t_locale) {
                    dati = backup;
                    linguaCorrente = dati.lingua || "it";
                    salvaLocale();
                    disegnaPagina();
                    console.log("🔄 Aggiornato dal BACKUP");
                } else {
                    console.log("✅ Backup non più recente");
                }
            } else if (!datiLocali) {
                console.log("🆕 Prima apertura: carico scheda base Tharnax");
                dati = JSON.parse(JSON.stringify(DATI_STANDARD));
                linguaCorrente = "it";
                disegnaPagina();
                await salvaBackup();
                console.log("✅ Scheda base salvata per:", ID_MINIATURA);
            }
        } catch (e) {
            console.log("Errore caricamento:", e);
            const contenuto = document.getElementById("contenuto");
            if (contenuto) {
                contenuto.innerHTML = `<div style="text-align:center; padding:60px; color:red;">❌ Errore nel caricamento.<br><small>${escapeHtml(String(e))}</small><br><br><button onclick="location.reload()">Ricarica</button></div>`;
            }
        }
    }

    // ========================================
    // SYNC AUTOMATICO AL RITORNO
    // ========================================
    document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState !== 'visible') return;
        if (sincronizzazioneInCorso) return;
        sincronizzazioneInCorso = true;
        try {
            const backup = await recuperaBackup();
            if (backup) {
                const t_backup = backup._ultimaModifica || 0;
                const t_locale = dati._ultimaModifica || 0;
                if (t_backup > t_locale) {
                    console.log("🔄 Aggiornamento dal server...");
                    dati = backup;
                    linguaCorrente = dati.lingua || "it";
                    salvaLocale();
                    disegnaPagina();
                    mostraStato("🔄 Sincronizzato dal server");
                }
            }
        } catch (e) { console.warn("Errore sync:", e); }
        finally { sincronizzazioneInCorso = false; }
    });

    window.setLingua = setLingua;
    window.switchTab = switchTab;
    window.abilitaModificaLore = abilitaModificaLore;
    window.salvaLore = salvaLore;
    window.salvaCampo = salvaCampo;
    window.salvaCaratteristica = salvaCaratteristica;

    caricaDati();
</script>
