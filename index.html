<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scheda Personaggio D&D - IL_TUO_SHOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #f9f3e2;
            background-image: linear-gradient(to bottom, #fff8ed, #f2e6d5);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 2px solid #d4af37;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container::before {
            content: "❧";
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 28px;
            color: #d4af37;
            opacity: 0.4;
            z-index: 1;
        }

        .container::after {
            content: "☙";
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 28px;
            color: #d4af37;
            opacity: 0.4;
            z-index: 1;
        }

        /* Header shop */
        .shop-header {
            background: #2c1810;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
            position: relative;
            z-index: 2;
        }

        .shop-header img {
            max-height: 60px;
            margin-bottom: 10px;
        }

        .shop-header h1 {
            color: #d4af37;
            font-size: 26px;
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
            text-shadow: 2px 2px 0 #1a0f0a;
        }

        .shop-header p {
            color: #c9ae6e;
            font-size: 12px;
            margin-top: 8px;
        }

        /* Barra lingua */
        .lang-bar {
            text-align: right;
            padding: 12px 20px;
            background: #e8dccc;
            border-bottom: 1px solid #d4c4a8;
            position: relative;
            z-index: 2;
        }

        .lang-btn {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 6px 18px;
            margin: 0 4px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 13px;
        }

        .lang-btn.active {
            background: #d4af37;
            color: #2c1810;
        }

        /* Contenuto principale */
        .content {
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        /* Media row (foto e audio) */
        .media-row {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4c4a8;
        }

        .char-img img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d4af37;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        audio {
            width: 320px;
            border-radius: 40px;
        }

        /* Statistiche principali in alto (sempre visibili) */
        .stats-top {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            background: #2c1810;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            color: #f9f3e2;
        }

        .stat-block {
            text-align: center;
            flex: 1;
            min-width: 80px;
        }

        .stat-block label {
            font-size: 12px;
            color: #d4af37;
            display: block;
        }

        .stat-block .value {
            font-size: 24px;
            font-weight: bold;
            background: #1a1a2e;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 10px;
            margin-top: 5px;
            min-width: 60px;
        }

        .stat-block input {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            background: #1a1a2e;
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 5px;
            width: 80px;
            color: #d4af37;
            font-family: inherit;
            margin-top: 5px;
        }

        /* Tabs navigazione */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 2px solid #d4c4a8;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: #e8dccc;
            color: #2c1810;
            border: none;
            padding: 10px 20px;
            border-radius: 30px 30px 0 0;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #d4af37;
            color: #1a1a2e;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-pane.active {
            display: block;
        }

        /* Schede stile D&D */
        .sheet-card {
            background: #fffef7;
            border: 1px solid #d4c4a8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .sheet-card h3 {
            color: #2c1810;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            margin-bottom: 18px;
            font-size: 18px;
            font-family: 'Georgia', serif;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 12px;
            align-items: baseline;
        }

        .form-row label {
            width: 140px;
            font-weight: bold;
            color: #3a2a1a;
            font-size: 14px;
        }

        .form-row input, .form-row textarea {
            flex: 1;
            background: #fefcf5;
            border: 1px solid #d4c4a8;
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'Georgia', serif;
            font-size: 14px;
        }

        .form-row textarea {
            resize: vertical;
            min-height: 60px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin: 20px 0;
            text-align: center;
        }

        .stat-box {
            background: #f3ecd9;
            border: 1px solid #c9ae6e;
            border-radius: 12px;
            padding: 10px;
        }

        .stat-box label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            color: #2c1810;
        }

        .stat-box input {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            width: 70px;
            margin: 8px auto 0;
            display: block;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 8px;
            padding: 5px;
            font-family: inherit;
        }

        .stat-box .mod {
            font-size: 12px;
            color: #d4af37;
            margin-top: 5px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 15px;
        }

        .skill-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-item label {
            width: 150px;
            font-size: 13px;
            font-weight: bold;
        }

        .skill-item input {
            width: 55px;
            text-align: center;
            background: #fefcf5;
            border: 1px solid #c9ae6e;
            border-radius: 6px;
            padding: 5px;
        }

        /* Barra di ricerca */
        .search-bar {
            margin-bottom: 15px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #c9ae6e;
            border-radius: 30px;
            background: #fefcf5;
            font-family: inherit;
        }

        /* Lista incantesimi/equipaggiamento */
        .item-list {
            list-style: none;
            padding: 0;
        }

        .item-list li {
            padding: 8px;
            border-bottom: 1px solid #e8dccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-list input {
            flex: 1;
            margin-right: 10px;
        }

        .add-item {
            background: #d4af37;
            color: #2c1810;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
        }

        .lore-box {
            background: #f3ecd9;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
        }

        .lore-text {
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .lore-textarea {
            width: 100%;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Georgia', serif;
            display: none;
            margin-bottom: 12px;
            min-height: 150px;
        }

        button {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 8px 22px;
            margin: 5px 5px 0 0;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        button:hover {
            background: #d4af37;
            color: #2c1810;
        }

        .footer {
            text-align: center;
            padding: 18px;
            background: #e8dccc;
            font-size: 11px;
            color: #5a4a3a;
            border-top: 1px solid #d4c4a8;
        }

        @media (max-width: 700px) {
            .content {
                padding: 15px;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .form-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .form-row label {
                margin-bottom: 5px;
            }
            .skills-grid {
                grid-template-columns: 1fr;
            }
            audio {
                width: 100%;
            }
            .stats-top {
                flex-wrap: wrap;
            }
            .tabs {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="shop-header">
        <img src="logo.png" alt="Logo" id="shop-logo" style="display:none;">
        <h1>⚔️ Raven Forge⚔️</h1>
        <p>La tua avventura, le tue scelte</p>
    </div>
    
    <div class="lang-bar">
        <button class="lang-btn" id="btn-ita" onclick="setLingua('it')">🇮🇹 Italiano</button>
        <button class="lang-btn" id="btn-eng" onclick="setLingua('en')">🇬🇧 English</button>
    </div>
    
    <div class="content" id="contenuto">
        <div style="text-align:center; padding:60px;">⏳ Caricamento personaggio...</div>
    </div>
    
    <div class="footer">
        🧙‍♂️ Tutti i dati si salvano automaticamente su questa miniatura<br>
        Scansiona l'NFC e ritroverai sempre il tuo personaggio
    </div>
</div>

<script>
    // ========================================
    // CONFIGURAZIONE
    // ========================================
    const URL_BACKUP = "https://script.google.com/macros/s/AKfycbyApNde1N4X3gjURh67eZVjRGCMkJjoSUwFmPrguxbcoWuJGA1qDYfhzN_-lFQgrV2P/exec";
    const ID_MINIATURA = "personaggio_001";
    const FILE_IMMAGINE = "immagine.png";
    const FILE_AUDIO_ITA = "audio-ita.mp3";
    const FILE_AUDIO_ENG = "audio-eng.mp3";
    
    // Testi delle etichette per lingua
    const labels = {
        it: {
            stats: "STATISTICHE PRINCIPALI",
            ca: "Classe Armatura (CA)",
            pf: "Punti Ferita",
            pf_att: "PF Attuali",
            iniziativa: "Iniziativa",
            velocita: "Velocità",
            combat: "⚔️ COMBATTIMENTO",
            spells: "🔮 INCANTESIMI",
            inventory: "🎒 EQUIPAGGIAMENTO",
            features: "✨ TRATTI",
            notes: "📝 NOTE & LORE",
            search: "Cerca...",
            attacchi: "Attacchi e Incantesimi",
            nome_attacco: "Nome attacco",
            bonus: "Bonus",
            danno: "Danno",
            trucchetti: "Trucchetti (Cantrips)",
            incantesimi_liv: "Incantesimi di livello",
            slot_utilizzati: "slot utilizzati",
            slot_totali: "slot totali",
            cd_ts: "CD Tiro Salvezza Incantesimi",
            bonus_attacco: "Bonus Attacco Incantesimi",
            equip: "Equipaggiamento",
            armi: "Armi",
            oggetti: "Oggetti magici",
            monete: "Monete",
            tratti_razziali: "Tratti Razziali",
            privilegi: "Privilegi di Classe",
            talenti: "Talenti",
            lore: "Lore / Storia del personaggio",
            modifica_lore: "✏️ Modifica Lore",
            salva_lore: "💾 Salva Lore"
        },
        en: {
            stats: "CORE STATS",
            ca: "Armor Class (AC)",
            pf: "Hit Points",
            pf_att: "Current HP",
            iniziativa: "Initiative",
            velocita: "Speed",
            combat: "⚔️ COMBAT",
            spells: "🔮 SPELLS",
            inventory: "🎒 INVENTORY",
            features: "✨ FEATURES",
            notes: "📝 NOTES & LORE",
            search: "Search...",
            attacchi: "Attacks & Spellcasting",
            nome_attacco: "Attack name",
            bonus: "Bonus",
            danno: "Damage",
            trucchetti: "Cantrips",
            incantesimi_liv: "Spell level",
            slot_utilizzati: "slots used",
            slot_totali: "total slots",
            cd_ts: "Spell Save DC",
            bonus_attacco: "Spell Attack Bonus",
            equip: "Equipment",
            armi: "Weapons",
            oggetti: "Magic Items",
            monete: "Coins",
            tratti_razziali: "Racial Traits",
            privilegi: "Class Features",
            talenti: "Feats",
            lore: "Character Lore / Story",
            modifica_lore: "✏️ Edit Lore",
            salva_lore: "💾 Save Lore"
        }
    };
    
    // DATI STANDARD
    const DATI_STANDARD = {
        lingua: "it",
        nome_pg: "Nome",
        classe_pg: "Classe",
        razza_pg: "Razza",
        livello_pg: "1",
        background_pg: "Background",
        allineamento: "Neutrale",
        esperienza: "0",
        forza: "10",
        destrezza: "10",
        costituzione: "10",
        intelligenza: "10",
        saggezza: "10",
        carisma: "10",
        pf_totali: "10",
        pf_attuali: "10",
        pf_temp: "0",
        dadi_vita: "1d8",
        ca: "10",
        iniziativa: "0",
        velocita: "9",
        ts_forza: "0",
        ts_destrezza: "0",
        ts_costituzione: "0",
        ts_intelligenza: "0",
        ts_saggezza: "0",
        ts_carisma: "0",
        acrobazia: "0",
        addestrare_animali: "0",
        arcano: "0",
        atletica: "0",
        furtivita: "0",
        indagare: "0",
        intimidire: "0",
        intuizione: "0",
        inganno: "0",
        medicina: "0",
        natura: "0",
        percezione: "0",
        persuasione: "0",
        religione: "0",
        rapidita_mano: "0",
        sopravvivenza: "0",
        storia: "0",
        attacchi: "[]",
        incantesimi: "[]",
        equipaggiamento: "[]",
        tratti_razziali: "Tratti razziali...",
        privilegi_classe: "Privilegi di classe...",
        talenti: "Talenti...",
        note: "Note personali...",
        lore_ita: "Scrivi qui la storia epica del tuo personaggio.",
        lore_eng: "Write your character's epic story here."
    };
    
    let dati = {};
    let linguaCorrente = "it";
    
    // Funzione per calcolare modificatore da punteggio
    function calcolaMod(punteggio) {
        return Math.floor((punteggio - 10) / 2);
    }
    
    // Backup (come prima)
    async function salvaBackup() {
        try {
            const daSalvare = { ...dati };
            const url = `${URL_BACKUP}?azione=backup&id=${ID_MINIATURA}&dati=${encodeURIComponent(JSON.stringify(daSalvare))}`;
            await fetch(url);
        } catch(e) {}
    }
    
    async function recuperaBackup() {
        try {
            const res = await fetch(`${URL_BACKUP}?azione=recupera&id=${ID_MINIATURA}`);
            const txt = await res.text();
            if (txt && txt !== "nessun_backup") return JSON.parse(txt);
        } catch(e) {}
        return null;
    }
    
    function salvaLocale() {
        localStorage.setItem(`pg_${ID_MINIATURA}`, JSON.stringify(dati));
    }
    
    async function salvaTutto() {
        salvaLocale();
        await salvaBackup();
    }
    
    async function caricaDati() {
        let locali = localStorage.getItem(`pg_${ID_MINIATURA}`);
        if (locali) {
            dati = JSON.parse(locali);
            linguaCorrente = dati.lingua || "it";
        } else {
            let backup = await recuperaBackup();
            if (backup) {
                dati = backup;
                linguaCorrente = dati.lingua || "it";
                salvaLocale();
            } else {
                dati = JSON.parse(JSON.stringify(DATI_STANDARD));
                salvaLocale();
                await salvaBackup();
            }
        }
        disegnaPagina();
    }
    
    async function setLingua(lingua) {
        linguaCorrente = lingua;
        dati.lingua = lingua;
        await salvaTutto();
        disegnaPagina();
    }
    
    async function salvaCampo(campo, valore) {
        dati[campo] = valore;
        await salvaTutto();
    }
    
    // Lore
    function abilitaModificaLore() {
        const testo = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;
        document.getElementById("lore-textarea").value = testo;
        document.getElementById("lore-textarea").style.display = "block";
        document.getElementById("lore-testo").style.display = "none";
        document.getElementById("btn-modifica-lore").style.display = "none";
        document.getElementById("btn-salva-lore").style.display = "inline-block";
    }
    
    async function salvaLore() {
        const nuovo = document.getElementById("lore-textarea").value;
        if (linguaCorrente === "it") {
            dati.lore_ita = nuovo;
        } else {
            dati.lore_eng = nuovo;
        }
        await salvaTutto();
        disegnaPagina();
    }
    
    // Tabs
    function switchTab(tabId) {
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`btn-${tabId}`).classList.add('active');
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function disegnaPagina() {
        const L = labels[linguaCorrente];
        const lore = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;
        const modForza = calcolaMod(parseInt(dati.forza) || 10);
        const modDes = calcolaMod(parseInt(dati.destrezza) || 10);
        const modCos = calcolaMod(parseInt(dati.costituzione) || 10);
        const modInt = calcolaMod(parseInt(dati.intelligenza) || 10);
        const modSag = calcolaMod(parseInt(dati.saggezza) || 10);
        const modCar = calcolaMod(parseInt(dati.carisma) || 10);
        
        const html = `
            <div class="media-row">
                <div class="char-img">
                    <img src="${FILE_IMMAGINE}" alt="Personaggio">
                </div>
                <audio controls>
                    <source src="${linguaCorrente === "it" ? FILE_AUDIO_ITA : FILE_AUDIO_ENG}" type="audio/mpeg">
                </audio>
            </div>
            
            <!-- Statistiche principali sempre visibili -->
            <div class="stats-top">
                <div class="stat-block"><label>${L.ca}</label><input type="text" value="${escapeHtml(dati.ca)}" onchange="salvaCampo('ca', this.value)"></div>
                <div class="stat-block"><label>${L.pf}</label><input type="text" value="${escapeHtml(dati.pf_totali)}" onchange="salvaCampo('pf_totali', this.value)"></div>
                <div class="stat-block"><label>${L.pf_att}</label><input type="text" value="${escapeHtml(dati.pf_attuali)}" onchange="salvaCampo('pf_attuali', this.value)"></div>
                <div class="stat-block"><label>${L.iniziativa}</label><input type="text" value="${escapeHtml(dati.iniziativa)}" onchange="salvaCampo('iniziativa', this.value)"></div>
                <div class="stat-block"><label>${L.velocita}</label><input type="text" value="${escapeHtml(dati.velocita)}" onchange="salvaCampo('velocita', this.value)"></div>
            </div>
            
            <!-- Tabs navigazione -->
            <div class="tabs">
                <button class="tab-btn active" id="btn-combat" onclick="switchTab('combat')">${L.combat}</button>
                <button class="tab-btn" id="btn-spells" onclick="switchTab('spells')">${L.spells}</button>
                <button class="tab-btn" id="btn-inventory" onclick="switchTab('inventory')">${L.inventory}</button>
                <button class="tab-btn" id="btn-features" onclick="switchTab('features')">${L.features}</button>
                <button class="tab-btn" id="btn-notes" onclick="switchTab('notes')">${L.notes}</button>
            </div>
            
            <!-- TAB COMBAT -->
            <div id="tab-combat" class="tab-pane active">
                <div class="sheet-card">
                    <h3>⭐ CARATTERISTICHE</h3>
                    <div class="stats-grid">
