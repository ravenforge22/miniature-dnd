<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scheda Personaggio - IL_TUO_SHOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #f9f3e2;
            background-image: linear-gradient(to bottom, #fff8ed, #f2e6d5);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid #c9ae6e;
            overflow: hidden;
        }

        /* Intestazione shop */
        .shop-header {
            background: #2c1810;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
        }

        .shop-header h1 {
            color: #d4af37;
            font-size: 28px;
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
            text-shadow: 2px 2px 0 #1a0f0a;
        }

        .shop-header p {
            color: #c9ae6e;
            font-size: 12px;
            margin-top: 8px;
        }

        /* Barra lingua */
        .lang-bar {
            text-align: right;
            padding: 12px 20px;
            background: #e8dccc;
            border-bottom: 1px solid #d4c4a8;
        }

        .lang-btn {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 6px 18px;
            margin: 0 4px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 13px;
        }

        .lang-btn.active {
            background: #d4af37;
            color: #2c1810;
        }

        /* Contenuto */
        .content {
            padding: 25px;
        }

        /* Foto e audio */
        .media-row {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4c4a8;
        }

        .char-img img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d4af37;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        audio {
            width: 320px;
            border-radius: 40px;
        }

        /* Schede stile D&D */
        .sheet-card {
            background: #fffef7;
            border: 1px solid #d4c4a8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .sheet-card h2 {
            color: #2c1810;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            margin-bottom: 18px;
            font-size: 20px;
            font-family: 'Georgia', serif;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 12px;
            align-items: baseline;
        }

        .form-row label {
            width: 140px;
            font-weight: bold;
            color: #3a2a1a;
            font-size: 14px;
        }

        .form-row input, .form-row textarea {
            flex: 1;
            background: #fefcf5;
            border: 1px solid #d4c4a8;
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'Georgia', serif;
            font-size: 14px;
        }

        .form-row textarea {
            resize: vertical;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin: 20px 0;
            text-align: center;
        }

        .stat-box {
            background: #f3ecd9;
            border: 1px solid #c9ae6e;
            border-radius: 12px;
            padding: 10px;
        }

        .stat-box label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            color: #2c1810;
        }

        .stat-box input {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            width: 70px;
            margin: 8px auto 0;
            display: block;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 8px;
            padding: 5px;
            font-family: inherit;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 15px;
        }

        .skill-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-item label {
            width: 140px;
            font-size: 13px;
            font-weight: bold;
        }

        .skill-item input {
            width: 55px;
            text-align: center;
            background: #fefcf5;
            border: 1px solid #c9ae6e;
            border-radius: 6px;
            padding: 5px;
        }

        .lore-box {
            background: #f3ecd9;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
        }

        .lore-text {
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .lore-textarea {
            width: 100%;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Georgia', serif;
            display: none;
            margin-bottom: 12px;
        }

        button {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 8px 22px;
            margin: 5px 5px 0 0;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        button:hover {
            background: #d4af37;
            color: #2c1810;
        }

        .footer {
            text-align: center;
            padding: 18px;
            background: #e8dccc;
            font-size: 11px;
            color: #5a4a3a;
            border-top: 1px solid #d4c4a8;
        }

        @media (max-width: 700px) {
            .content {
                padding: 15px;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .form-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .form-row label {
                margin-bottom: 5px;
            }
            .skills-grid {
                grid-template-columns: 1fr;
            }
            audio {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="shop-header">
        <h1>⚔️ Raven Forge ⚔️</h1>
        <p>Miniature che ricordano tutto | La tua avventura, le tue scelte</p>
    </div>
    
    <div class="lang-bar">
        <button class="lang-btn" id="btn-ita" onclick="setLingua('it')">🇮🇹 Italiano</button>
        <button class="lang-btn" id="btn-eng" onclick="setLingua('en')">🇬🇧 English</button>
    </div>
    
    <div class="content" id="contenuto">
        <div style="text-align:center; padding:60px;">⏳ Caricamento personaggio...</div>
    </div>
    
    <div class="footer">
        🧙‍♂️ Tutti i dati si salvano automaticamente su questa miniatura<br>
        Scansiona l'NFC e ritroverai sempre il tuo personaggio, anche da un altro telefono
    </div>
</div>

<script>
    // ========================================
    // CONFIGURAZIONE - PERSONALIZZA QUI
    // ========================================
    
    // URL dello script di backup (dal passo 3)
    const URL_BACKUP = "https://script.google.com/macros/s/AKfycbyApNde1N4X3gjURh67eZVjRGCMkJjoSUwFmPrguxbcoWuJGA1qDYfhzN_-lFQgrV2P/exec";
    
    // ID UNICO di questa miniatura (cambia per ogni miniatura che vendi!)
    const ID_MINIATURA = "personaggio_001";
    
    // I tuoi file
    const FILE_IMMAGINE = "immagine.jpg";
    const FILE_AUDIO_ITA = "audio-ita.mp3";
    const FILE_AUDIO_ENG = "audio-eng.mp3";
    
    // Lore di default (scritta da te, in italiano e inglese)
    const LORE_DEFAULT_ITA = "Scrivi qui la storia epica del tuo personaggio. Ogni modifica verrà salvata per sempre su questa miniatura.";
    const LORE_DEFAULT_ENG = "Write your character's epic story here. Every change will be saved forever on this miniature.";
    
    // Valori standard della scheda
    const DATI_STANDARD = {
        lingua: "it",
        nome_pg: "Nome",
        classe_pg: "Classe",
        razza_pg: "Razza",
        livello_pg: "1",
        background_pg: "Background",
        allineamento: "Neutrale",
        esperienza: "0",
        forza: "10",
        destrezza: "10",
        costituzione: "10",
        intelligenza: "10",
        saggezza: "10",
        carisma: "10",
        pf_totali: "10",
        pf_attuali: "10",
        pf_temp: "0",
        dadi_vita: "1d8",
        ca: "10",
        iniziativa: "0",
        velocita: "9",
        ts_forza: "0",
        ts_destrezza: "0",
        ts_costituzione: "0",
        ts_intelligenza: "0",
        ts_saggezza: "0",
        ts_carisma: "0",
        acrobazia: "0",
        addestrare_animali: "0",
        arcano: "0",
        atletica: "0",
        furtivita: "0",
        indagare: "0",
        intimidire: "0",
        intuizione: "0",
        inganno: "0",
        medicina: "0",
        natura: "0",
        percezione: "0",
        persuasione: "0",
        religione: "0",
        rapidita_mano: "0",
        sopravvivenza: "0",
        storia: "0",
        tratti_personalita: "Inserisci i tratti del personaggio...",
        ideali: "Inserisci gli ideali...",
        legami: "Inserisci i legami...",
        difetti: "Inserisci i difetti...",
        tratti_razziali: "Tratti razziali...",
        privilegi_classe: "Privilegi di classe...",
        talenti: "Talenti...",
        equipaggiamento: "Equipaggiamento...",
        incantesimi: "Incantesimi...",
        monete: "PE:0 PO:0 PA:0 PR:0 PM:0",
        note: "Note personali...",
        lore_ita: LORE_DEFAULT_ITA,
        lore_eng: LORE_DEFAULT_ENG
    };
    
    // ========================================
    // NON MODIFICARE NULLA SOTTO (se non sai cosa fai)
    // ========================================
    
    let dati = {};
    let linguaCorrente = "it";
    
    // Backup
    async function salvaBackup() {
        try {
            const daSalvare = { ...dati };
            const url = `${URL_BACKUP}?azione=backup&id=${ID_MINIATURA}&dati=${encodeURIComponent(JSON.stringify(daSalvare))}`;
            await fetch(url);
        } catch(e) { console.log("Backup non riuscito"); }
    }
    
    async function recuperaBackup() {
        try {
            const res = await fetch(`${URL_BACKUP}?azione=recupera&id=${ID_MINIATURA}`);
            const txt = await res.text();
            if (txt && txt !== "nessun_backup") return JSON.parse(txt);
        } catch(e) {}
        return null;
    }
    
    function salvaLocale() {
        localStorage.setItem(`pg_${ID_MINIATURA}`, JSON.stringify(dati));
    }
    
    async function salvaTutto() {
        salvaLocale();
        await salvaBackup();
    }
    
    async function caricaDati() {
        let locali = localStorage.getItem(`pg_${ID_MINIATURA}`);
        if (locali) {
            dati = JSON.parse(locali);
            linguaCorrente = dati.lingua || "it";
        } else {
            let backup = await recuperaBackup();
            if (backup) {
                dati = backup;
                linguaCorrente = dati.lingua || "it";
                salvaLocale();
            } else {
                dati = JSON.parse(JSON.stringify(DATI_STANDARD));
                salvaLocale();
                await salvaBackup();
            }
        }
        disegnaPagina();
    }
    
    async function setLingua(lingua) {
        linguaCorrente = lingua;
        dati.lingua = lingua;
        await salvaTutto();
        disegnaPagina();
    }
    
    async function salvaCampo(campo, valore) {
        dati[campo] = valore;
        await salvaTutto();
    }
    
    // Lore
    function abilitaModificaLore() {
        const testo = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;
        document.getElementById("lore-textarea").value = testo;
        document.getElementById("lore-textarea").style.display = "block";
        document.getElementById("lore-testo").style.display = "none";
        document.getElementById("btn-modifica-lore").style.display = "none";
        document.getElementById("btn-salva-lore").style.display = "inline-block";
    }
    
    async function salvaLore() {
        const nuovo = document.getElementById("lore-textarea").value;
        if (linguaCorrente === "it") {
            dati.lore_ita = nuovo;
        } else {
            dati.lore_eng = nuovo;
        }
        await salvaTutto();
        disegnaPagina();
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function disegnaPagina() {
        const lore = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;
        
        const html = `
            <div class="media-row">
                <div class="char-img">
                    <img src="${FILE_IMMAGINE}" alt="Personaggio">
                </div>
                <audio controls>
                    <source src="${linguaCorrente === "it" ? FILE_AUDIO_ITA : FILE_AUDIO_ENG}" type="audio/mpeg">
                </audio>
            </div>
            
            <!-- SCHEDA PERSONAGGIO (stile PDF) -->
            <div class="sheet-card">
                <h2>📜 SCHEDA PERSONAGGIO</h2>
                <div class="form-row"><label>Nome:</label><input type="text" value="${escapeHtml(dati.nome_pg)}" onchange="salvaCampo('nome_pg', this.value)"></div>
                <div class="form-row"><label>Classe / Livello:</label><input type="text" value="${escapeHtml(dati.classe_pg)}" onchange="salvaCampo('classe_pg', this.value)" style="flex:0.4"><input type="text" value="${escapeHtml(dati.livello_pg)}" onchange="salvaCampo('livello_pg', this.value)" style="flex:0.2; margin-left:10px;"></div>
                <div class="form-row"><label>Razza:</label><input type="text" value="${escapeHtml(dati.razza_pg)}" onchange="salvaCampo('razza_pg', this.value)"></div>
                <div class="form-row"><label>Background:</label><input type="text" value="${escapeHtml(dati.background_pg)}" onchange="salvaCampo('background_pg', this.value)"></div>
                <div class="form-row"><label>Allineamento:</label><input type="text" value="${escapeHtml(dati.allineamento)}" onchange="salvaCampo('allineamento', this.value)"></div>
                <div class="form-row"><label>Punti Esperienza:</label><input type="text" value="${escapeHtml(dati.esperienza)}" onchange="salvaCampo('esperienza', this.value)"></div>
            </div>
            
            <div class="sheet-card">
                <h2>⭐ CARATTERISTICHE</h2>
                <div class="stats-grid">
                    <div class="stat-box"><label>FORZA</label><input type="number" value="${dati.forza}" onchange="salvaCampo('forza', this.value)"></div>
                    <div class="stat-box"><label>DESTREZZA</label><input type="number" value="${dati.destrezza}" onchange="salvaCampo('destrezza', this.value)"></div>
                    <div class="stat-box"><label>COSTITUZIONE</label><input type="number" value="${dati.costituzione}" onchange="salvaCampo('costituzione', this.value)"></div>
                    <div class="stat-box"><label>INTELLIGENZA</label><input type="number" value="${dati.intelligenza}" onchange="salvaCampo('intelligenza', this.value)"></div>
                    <div class="stat-box"><label>SAGGEZZA</label><input type="number" value="${dati.saggezza}" onchange="salvaCampo('saggezza', this.value)"></div>
                    <div class="stat-box"><label>CARISMA</label><input type="number" value="${dati.carisma}" onchange="salvaCampo('carisma', this.value)"></div>
                </div>
            </div>
            
            <div class="sheet-card">
                <h2>⚔️ COMBATTIMENTO</h2>
                <div class="form-row"><label>PF Totali:</label><input type="text" value="${escapeHtml(dati.pf_totali)}" onchange="salvaCampo('pf_totali', this.value)"></div>
                <div class="form-row"><label>PF Attuali:</label><input type="text" value="${escapeHtml(dati.pf_attuali)}" onchange="salvaCampo('pf_attuali', this.value)"></div>
                <div class="form-row"><label>PF Temporanei:</label><input type="text" value="${escapeHtml(dati.pf_temp)}" onchange="salvaCampo('pf_temp', this.value)"></div>
                <div class="form-row"><label>Dadi Vita:</label><input type="text" value="${escapeHtml(dati.dadi_vita)}" onchange="salvaCampo('dadi_vita', this.value)"></div>
                <div class="form-row"><label>Classe Armatura (CA):</label><input type="text" value="${escapeHtml(dati.ca)}" onchange="salvaCampo('ca', this.value)"></div>
                <div class="form-row"><label>Iniziativa:</label><input type="text" value="${escapeHtml(dati.iniziativa)}" onchange="salvaCampo('iniziativa', this.value)"></div>
                <div class="form-row"><label>Velocità:</label><input type="text" value="${escapeHtml(dati.velocita)}" onchange="salvaCampo('velocita', this.value)"></div>
            </div>
            
            <div class="sheet-card">
                <h2>🛡️ TIRO SALVEZZA</h2>
                <div class="stats-grid">
                    <div class="stat-box"><label>FORZA</label><input type="text" value="${dati.ts_forza}" onchange="salvaCampo('ts_forza', this.value)"></div>
                    <div class="stat-box"><label>DESTREZZA</label><input type="text" value="${dati.ts_destrezza}" onchange="salvaCampo('ts_destrezza', this.value)"></div>
                    <div class="stat-box"><label>COSTITUZIONE</label><input type="text" value="${dati.ts_costituzione}" onchange="salvaCampo('ts_costituzione', this.value)"></div>
                    <div class="stat-box"><label>INTELLIGENZA</label><input type="text" value="${dati.ts_intelligenza}" onchange="salvaCampo('ts_intelligenza', this.value)"></div>
                    <div class="stat-box"><label>SAGGEZZA</label><input type="text" value="${dati.ts_saggezza}" onchange="salvaCampo('ts_saggezza', this.value)"></div>
                    <div class="stat-box"><label>CARISMA</label><input type="text" value="${dati.ts_carisma}" onchange="salvaCampo('ts_carisma', this.value)"></div>
                </div>
            </div>
            
            <div class="sheet-card">
                <h2>🎯 COMPETENZE</h2>
                <div class="skills-grid">
                    <div class="skill-item"><label>Acrobazia (Des):</label><input type="text" value="${dati.acrobazia}" onchange="salvaCampo('acrobazia', this.value)"></div>
                    <div class="skill-item"><label>Addestrare Animali (Sag):</label><input type="text" value="${dati.addestrare_animali}" onchange="salvaCampo('addestrare_animali', this.value)"></div>
                    <div class="skill-item"><label>Arcano (Int):</label><input type="text" value="${dati.arcano}" onchange="salvaCampo('arcano', this.value)"></div>
                    <div class="skill-item"><label>Atletica (For):</label><input type="text" value="${dati.atletica}" onchange="salvaCampo('atletica', this.value)"></div>
                    <div class="skill-item"><label>Furtività (Des):</label><input type="text" value="${dati.furtivita}" onchange="salvaCampo('furtivita', this.value)"></div>
                    <div class="skill-item"><label>Indagare (Int):</label><input type="text" value="${dati.indagare}" onchange="salvaCampo('indagare', this.value)"></div>
                    <div class="skill-item"><label>Intimidire (Car):</label><input type="text" value="${dati.intimidire}" onchange="salvaCampo('intimidire', this.value)"></div>
                    <div class="skill-item"><label>Intuizione (Sag):</label><input type="text" value="${dati.intuizione}" onchange="salvaCampo('intuizione', this.value)"></div>
                    <div class="skill-item"><label>Inganno (Car):</label><input type="text" value="${dati.inganno}" onchange="salvaCampo('inganno', this.value)"></div>
                    <div class="skill-item"><label>Medicina (Sag):</label><input type="text" value="${dati.medicina}" onchange="salvaCampo('medicina', this.value)"></div>
                    <div class="skill-item"><label>Natura (Int):</label><input type="text" value="${dati.natura}" onchange="salvaCampo('natura', this.value)"></div>
                    <div class="skill-item"><label>Percezione (Sag):</label><input type="text" value="${dati.percezione}" onchange="salvaCampo('percezione', this.value)"></div>
                    <div class="skill-item"><label>Persuasione (Car):</label><input type="text" value="${dati.persuasione}" onchange="salvaCampo('persuasione', this.value)"></div>
                    <div class="skill-item"><label>Religione (Int):</label><input type="text" value="${dati.religione}" onchange="salvaCampo('religione', this.value)"></div>
                    <div class="skill-item"><label>Rapidità di Mano (Des):</label><input type="text" value="${dati.rapidita_mano}" onchange="salvaCampo('rapidita_mano', this.value)"></div>
                    <div class="skill-item"><label>Sopravvivenza (Sag):</label><input type="text" value="${dati.sopravvivenza}" onchange="salvaCampo('sopravvivenza', this.value)"></div>
                    <div class="skill-item"><label>Storia (Int):</label><input type="text" value="${dati.storia}" onchange="salvaCampo('storia', this.value)"></div>
                </div>
            </div>
            
            <div class="sheet-card">
                <h2>✨ TRATTI E BACKGROUND</h2>
                <div class="form-row"><label>Tratti Personalità:</label><textarea rows="2" onchange="salvaCampo('tratti_personalita', this.value)">${escapeHtml(dati.tratti_personalita)}</textarea></div>
                <div class="form-row"><label>Ideali:</label><textarea rows="2" onchange="salvaCampo('ideali', this.value)">${escapeHtml(dati.ideali)}</textarea></div>
                <div class="form-row"><label>Legami:</label><textarea rows="2" onchange="salvaCampo('legami', this.value)">${escapeHtml(dati.legami)}</textarea></div>
                <div class="form-row"><label>Difetti:</label><textarea rows="2" onchange="salvaCampo('difetti', this.value)">${escapeHtml(dati.difetti)}</textarea></div>
                <div class="form-row"><label>Tratti Razziali:</label><textarea rows="2" onchange="salvaCampo('tratti_razziali', this.value)">${escapeHtml(dati.tratti_razziali)}</textarea></div>
                <div class="form-row"><label>Privilegi di Classe:</label><textarea rows="2" onchange="salvaCampo('privilegi_classe', this.value)">${escapeHtml(dati.privilegi_classe)}</textarea></div>
                <div class="form-row"><label>Talenti:</label><textarea rows="2" onchange="salvaCampo('talenti', this.value)">${escapeHtml(dati.talenti)}</textarea></div>
            </div>
            
            <div class="sheet-card">
                <h2>📦 EQUIPAGGIAMENTO</h2>
                <div class="form-row"><textarea rows="3" onchange="salvaCampo('equipaggiamento', this.value)">${escapeHtml(dati.equipaggiamento)}</textarea></div>
                <div class="form-row"><label>Monete:</label><input type="text" value="${escapeHtml(dati.monete)}" onchange="salvaCampo('monete', this.value)"></div>
                <div class="form-row"><label>Incantesimi:</label><textarea rows="3" onchange="salvaCampo('incantesimi', this.value)">${escapeHtml(dati.incantesimi)}</textarea></div>
                <div class="form-row"><label>Note:</label><textarea rows="2" onchange="salvaCampo('note', this.value)">${escapeHtml(dati.note)}</textarea></div>
            </div>
            
            <!-- LORE MODIFICABILE -->
            <div class="sheet-card">
                <h2>📖 LORE / STORIA</h2>
                <div class="lore-box">
                    <div id="lore-testo" class="lore-text">${escapeHtml(lore).replace(/\n/g, '<br>')}</div>
                    <textarea id="lore-textarea" class="lore-textarea" rows="8">${escapeHtml(lore)}</textarea>
                    <button id="btn-modifica-lore" onclick="abilitaModificaLore()">✏️ Modifica Lore</button>
                    <button id="btn-salva-lore" class="btn-salva" style="display:none;" onclick="salvaLore()">💾 Salva Lore</button>
                </div>
            </div>
        `;
        
        document.getElementById("contenuto").innerHTML = html;
    }
    
    caricaDati();
</script>
</body>
</html>
