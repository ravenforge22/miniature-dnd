<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scheda Personaggio D&D - IL_TUO_SHOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2c2416;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #faf3e0;
            background-image: linear-gradient(to bottom, #fff8ed, #f2e6d5);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid #c9ae6e;
            overflow: hidden;
        }

        /* Header shop */
        .shop-header {
            background: #2c1810;
            padding: 18px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
        }
        .shop-header h1 {
            color: #d4af37;
            font-size: 26px;
            letter-spacing: 2px;
            font-family: 'Georgia', serif;
        }
        .shop-header p {
            color: #c9ae6e;
            font-size: 11px;
            margin-top: 6px;
        }

        /* Lingua */
        .lang-bar {
            text-align: right;
            padding: 12px 20px;
            background: #e8dccc;
            border-bottom: 1px solid #d4c4a8;
        }
        .lang-btn {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 5px 16px;
            margin: 0 3px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .lang-btn.active {
            background: #d4af37;
            color: #2c1810;
        }

        /* Contenuto */
        .sheet-content {
            padding: 25px;
        }

        /* Media (foto e audio) */
        .media-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4c4a8;
        }
        .char-img img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d4af37;
        }
        audio {
            width: 300px;
        }

        /* Card stile pergamena */
        .card {
            background: #fffef7;
            border: 1px solid #d4c4a8;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .card h2 {
            color: #2c1810;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 18px;
            font-family: 'Georgia', serif;
        }
        .card h3 {
            color: #3a2a1a;
            margin: 12px 0 8px;
            font-size: 15px;
            border-left: 3px solid #d4af37;
            padding-left: 10px;
        }

        /* Righe form */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 10px;
            align-items: baseline;
        }
        .form-row label {
            width: 140px;
            font-weight: bold;
            font-size: 13px;
            color: #2c1810;
        }
        .form-row input, .form-row textarea {
            flex: 1;
            background: #fefcf5;
            border: 1px solid #d4c4a8;
            border-radius: 6px;
            padding: 6px 10px;
            font-family: 'Georgia', serif;
            font-size: 13px;
        }
        .form-row textarea {
            resize: vertical;
        }

        /* Griglia caratteristiche */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin: 15px 0;
            text-align: center;
        }
        .stat-box {
            background: #f3ecd9;
            border: 1px solid #c9ae6e;
            border-radius: 10px;
            padding: 8px;
        }
        .stat-box label {
            font-size: 12px;
            font-weight: bold;
            display: block;
            color: #2c1810;
        }
        .stat-box input {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            width: 65px;
            margin: 5px auto 0;
            display: block;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 6px;
            padding: 4px;
        }
        .mod-small {
            font-size: 11px;
            color: #6b4c3a;
        }

        /* Griglia tiri salvezza e competenze */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .skill-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .skill-item label {
            width: 130px;
            font-size: 12px;
            font-weight: bold;
        }
        .skill-item input {
            width: 50px;
            text-align: center;
            background: #fefcf5;
            border: 1px solid #c9ae6e;
            border-radius: 5px;
            padding: 4px;
        }

        /* Bottoni */
        button {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 6px 18px;
            margin: 5px 5px 0 0;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        button:hover {
            background: #d4af37;
            color: #2c1810;
        }
        .lore-box {
            background: #f3ecd9;
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
        }
        .lore-text {
            line-height: 1.5;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .lore-textarea {
            width: 100%;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 10px;
            padding: 12px;
            font-family: 'Georgia', serif;
            display: none;
            margin-bottom: 10px;
        }
        .footer {
            text-align: center;
            padding: 15px;
            background: #e8dccc;
            font-size: 10px;
            color: #5a4a3a;
            border-top: 1px solid #d4c4a8;
        }
        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .two-columns { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; align-items: flex-start; }
            .form-row label { margin-bottom: 4px; }
            audio { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="shop-header">
        <h1>⚔️ Raven Forge ⚔️</h1>
        <p>Miniature che ricordano tutto | La tua avventura, le tue scelte</p>
    </div>
    <div class="lang-bar">
        <button class="lang-btn" id="btn-ita" onclick="setLingua('it')">🇮🇹 Italiano</button>
        <button class="lang-btn" id="btn-eng" onclick="setLingua('en')">🇬🇧 English</button>
    </div>
    <div class="sheet-content" id="contenuto">
        <div style="text-align:center; padding:60px;">⏳ Caricamento personaggio...</div>
    </div>
    <div class="footer">
        🧙‍♂️ Tutti i dati si salvano automaticamente su questa miniatura
    </div>
</div>

<script>
    // ========================================
    // CONFIGURAZIONE - PERSONALIZZA QUI
    // ========================================
    const URL_BACKUP = "https://script.google.com/macros/s/AKfycbyApNde1N4X3gjURh67eZVjRGCMkJjoSUwFmPrguxbcoWuJGA1qDYfhzN_-lFQgrV2P/exec";
    const ID_MINIATURA = "personaggio_001";
    const FILE_IMMAGINE = "immagine.jpg";
    const FILE_AUDIO_ITA = "audio-ita.mp3";
    const FILE_AUDIO_ENG = "audio-eng.mp3";

    // Testi bilingue per ETICHETTE
    const labels = {
        it: {
            name: "NOME PERSONAGGIO", class: "CLASSE & LIVELLO", race: "RAZZA", background: "BACKGROUND", alignment: "ALLINEAMENTO", exp: "PUNTI ESPERIENZA",
            strength: "FORZA", dexterity: "DESTREZZA", constitution: "COSTITUZIONE", intelligence: "INTELLIGENZA", wisdom: "SAGGEZZA", charisma: "CARISMA",
            inspiration: "ISPIRAZIONE", profBonus: "BONUS PROF.", savingThrows: "TIRO SALVEZZA", skills: "COMPETENZE",
            acrobatics: "Acrobazia (Des)", animal: "Addestrare Animali (Sag)", arcana: "Arcano (Int)", athletics: "Atletica (For)", deception: "Inganno (Car)",
            history: "Storia (Int)", insight: "Intuizione (Sag)", intimidation: "Intimidire (Car)", investigation: "Indagare (Int)",
            medicine: "Medicina (Sag)", nature: "Natura (Int)", perception: "Percezione (Sag)", performance: "Intrattenere (Car)",
            persuasion: "Persuasione (Car)", religion: "Religione (Int)", sleight: "Rapidità di Mano (Des)", stealth: "Furtività (Des)",
            survival: "Sopravvivenza (Sag)",
            hp: "PUNTI FERITA", tempHp: "PF TEMPORANEI", hitDice: "DADI VITA", deathSaves: "TIRO SALVEZZA MORTE",
            attacks: "ATTACCHI & INCANTESIMI", equipment: "EQUIPAGGIAMENTO", traits: "TRATTI & PRIVILEGI",
            treasure: "TESORO", allies: "ALLEATI & ORGANIZZAZIONI", notes: "NOTE & STORIA", lore: "LORE / STORIA"
        },
        en: {
            name: "CHARACTER NAME", class: "CLASS & LEVEL", race: "RACE", background: "BACKGROUND", alignment: "ALIGNMENT", exp: "EXPERIENCE POINTS",
            strength: "STRENGTH", dexterity: "DEXTERITY", constitution: "CONSTITUTION", intelligence: "INTELLIGENCE", wisdom: "WISDOM", charisma: "CHARISMA",
            inspiration: "INSPIRATION", profBonus: "PROFICIENCY BONUS", savingThrows: "SAVING THROWS", skills: "SKILLS",
            acrobatics: "Acrobatics (Dex)", animal: "Animal Handling (Wis)", arcana: "Arcana (Int)", athletics: "Athletics (Str)", deception: "Deception (Cha)",
            history: "History (Int)", insight: "Insight (Wis)", intimidation: "Intimidation (Cha)", investigation: "Investigation (Int)",
            medicine: "Medicine (Wis)", nature: "Nature (Int)", perception: "Perception (Wis)", performance: "Performance (Cha)",
            persuasion: "Persuasion (Cha)", religion: "Religion (Int)", sleight: "Sleight of Hand (Dex)", stealth: "Stealth (Dex)",
            survival: "Survival (Wis)",
            hp: "HIT POINTS", tempHp: "TEMP HP", hitDice: "HIT DICE", deathSaves: "DEATH SAVES",
            attacks: "ATTACKS & SPELLS", equipment: "EQUIPMENT", traits: "TRAITS & FEATURES",
            treasure: "TREASURE", allies: "ALLIES & ORGANIZATIONS", notes: "NOTES & HISTORY", lore: "LORE / STORY"
        }
    };

    // Dati standard
    const DATI_STANDARD = {
        lingua: "it",
        nome: "Nome", classe: "Guerriero", livello: "1", razza: "Umano", background: "Soldato", allineamento: "Neutrale", esperienza: "0",
        forza: "10", destrezza: "10", costituzione: "10", intelligenza: "10", saggezza: "10", carisma: "10",
        ispirazione: "", profBonus: "2",
        ts_forza: "0", ts_destrezza: "0", ts_costituzione: "0", ts_intelligenza: "0", ts_saggezza: "0", ts_carisma: "0",
        pf_totali: "10", pf_attuali: "10", pf_temp: "0", dadi_vita: "1d10",
        acrobazia: "0", addestrare_animali: "0", arcano: "0", atletica: "0", inganno: "0", storia: "0", intuizione: "0", intimidire: "0",
        indagare: "0", medicina: "0", natura: "0", percezione: "0", intrattenere: "0", persuasione: "0", religione: "0", rapidita_mano: "0",
        furtivita: "0", sopravvivenza: "0",
        attacchi: "", equipaggiamento: "", tratti: "", tesoro: "", alleati: "", note: "",
        lore_ita: "Scrivi qui la storia del tuo personaggio...", lore_eng: "Write your character's story here..."
    };

    let dati = {};
    let linguaCorrente = "it";

    // Backup (identico a prima)
    async function salvaBackup() {
        try { await fetch(`${URL_BACKUP}?azione=backup&id=${ID_MINIATURA}&dati=${encodeURIComponent(JSON.stringify(dati))}`); } catch(e) {}
    }
    async function recuperaBackup() {
        try { const res = await fetch(`${URL_BACKUP}?azione=recupera&id=${ID_MINIATURA}`); const txt = await res.text(); if (txt && txt !== "nessun_backup") return JSON.parse(txt); } catch(e) {}
        return null;
    }
    function salvaLocale() { localStorage.setItem(`pg_${ID_MINIATURA}`, JSON.stringify(dati)); }
    async function salvaTutto() { salvaLocale(); await salvaBackup(); }
    async function salvaCampo(campo, valore) { dati[campo] = valore; await salvaTutto(); }

    async function caricaDati() {
        let locali = localStorage.getItem(`pg_${ID_MINIATURA}`);
        if (locali) {
            dati = JSON.parse(locali);
            linguaCorrente = dati.lingua || "it";
        } else {
            let backup = await recuperaBackup();
            if (backup) { dati = backup; linguaCorrente = dati.lingua || "it"; salvaLocale(); }
            else { dati = JSON.parse(JSON.stringify(DATI_STANDARD)); salvaLocale(); await salvaBackup(); }
        }
        disegnaPagina();
    }
    async function setLingua(lingua) { linguaCorrente = lingua; dati.lingua = lingua; await salvaTutto(); disegnaPagina(); }

    // Lore
    function abilitaModificaLore() {
        const testo = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;
        document.getElementById("lore-textarea").value = testo;
        document.getElementById("lore-textarea").style.display = "block";
        document.getElementById("lore-testo").style.display = "none";
        document.getElementById("btn-modifica-lore").style.display = "none";
        document.getElementById("btn-salva-lore").style.display = "inline-block";
    }
    async function salvaLore() {
        const nuovo = document.getElementById("lore-textarea").value;
        if (linguaCorrente === "it") dati.lore_ita = nuovo;
        else dati.lore_eng = nuovo;
        await salvaTutto();
        disegnaPagina();
    }
    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

    function disegnaPagina() {
        const L = labels[linguaCorrente];
        const lore = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;

        const html = `
            <div class="media-row">
                <div class="char-img"><img src="${FILE_IMMAGINE}" alt="Personaggio"></div>
                <audio controls><source src="${linguaCorrente === "it" ? FILE_AUDIO_ITA : FILE_AUDIO_ENG}" type="audio/mpeg"></audio>
            </div>

            <!-- INTESTAZIONE NOME E INFO -->
            <div class="card">
                <div class="form-row"><label>${L.name}:</label><input type="text" value="${escapeHtml(dati.nome)}" onchange="salvaCampo('nome', this.value)"></div>
                <div class="form-row"><label>${L.class}:</label><input type="text" value="${escapeHtml(dati.classe)}" onchange="salvaCampo('classe', this.value)" style="flex:0.4"><input type="text" value="${escapeHtml(dati.livello)}" onchange="salvaCampo('livello', this.value)" style="flex:0.2; margin-left:8px;"></div>
                <div class="form-row"><label>${L.race}:</label><input type="text" value="${escapeHtml(dati.razza)}" onchange="salvaCampo('razza', this.value)"></div>
                <div class="form-row"><label>${L.background}:</label><input type="text" value="${escapeHtml(dati.background)}" onchange="salvaCampo('background', this.value)"></div>
                <div class="form-row"><label>${L.alignment}:</label><input type="text" value="${escapeHtml(dati.allineamento)}" onchange="salvaCampo('allineamento', this.value)"></div>
                <div class="form-row"><label>${L.exp}:</label><input type="text" value="${escapeHtml(dati.esperienza)}" onchange="salvaCampo('esperienza', this.value)"></div>
            </div>

            <!-- CARATTERISTICHE -->
            <div class="card">
                <h2>${L.strength} / ${L.dexterity} / ${L.constitution} / ${L.intelligence} / ${L.wisdom} / ${L.charisma}</h2>
                <div class="stats-grid">
                    ${['forza','destrezza','costituzione','intelligenza','saggezza','carisma'].map(stat => `<div class="stat-box"><label>${L[stat]}</label><input type="number" value="${dati[stat]}" onchange="salvaCampo('${stat}', this.value)"></div>`).join('')}
                </div>
                <div class="form-row"><label>${L.inspiration}:</label><input type="text" value="${escapeHtml(dati.ispirazione)}" onchange="salvaCampo('ispirazione', this.value)"></div>
                <div class="form-row"><label>${L.profBonus}:</label><input type="text" value="${escapeHtml(dati.profBonus)}" onchange="salvaCampo('profBonus', this.value)"></div>
            </div>

            <!-- TIRO SALVEZZA E COMPETENZE -->
            <div class="card">
                <div class="two-columns">
                    <div><h3>${L.savingThrows}</h3>
                        ${['ts_forza','ts_destrezza','ts_costituzione','ts_intelligenza','ts_saggezza','ts_carisma'].map((t,i) => `<div class="skill-item"><label>${L[['strength','dexterity','constitution','intelligence','wisdom','charisma'][i]]}</label><input type="text" value="${dati[t]}" onchange="salvaCampo('${t}', this.value)"></div>`).join('')}
                    </div>
                    <div><h3>${L.skills}</h3>
                        ${['acrobazia','addestrare_animali','arcano','atletica','inganno','storia','intuizione','intimidire','indagare','medicina','natura','percezione','intrattenere','persuasione','religione','rapidita_mano','furtivita','sopravvivenza'].map(s => `<div class="skill-item"><label>${L[s]}</label><input type="text" value="${dati[s]}" onchange="salvaCampo('${s}', this.value)"></div>`).join('')}
                    </div>
                </div>
            </div>

            <!-- PUNTI FERITA E ATTACCHI -->
            <div class="card">
                <h3>${L.hp}</h3>
                <div class="form-row"><label>${L.hp} (totali):</label><input type="text" value="${escapeHtml(dati.pf_totali)}" onchange="salvaCampo('pf_totali', this.value)"></div>
                <div class="form-row"><label>${L.hp} (attuali):</label><input type="text" value="${escapeHtml(dati.pf_attuali)}" onchange="salvaCampo('pf_attuali', this.value)"></div>
                <div class="form-row"><label>${L.tempHp}:</label><input type="text" value="${escapeHtml(dati.pf_temp)}" onchange="salvaCampo('pf_temp', this.value)"></div>
                <div class="form-row"><label>${L.hitDice}:</label><input type="text" value="${escapeHtml(dati.dadi_vita)}" onchange="salvaCampo('dadi_vita', this.value)"></div>
                <h3>${L.attacks}</h3>
                <textarea rows="2" onchange="salvaCampo('attacchi', this.value)">${escapeHtml(dati.attacchi)}</textarea>
            </div>

            <!-- EQUIPAGGIAMENTO, TRATTI, TESORO, ALLEATI -->
            <div class="card"><h3>${L.equipment}</h3><textarea rows="3" onchange="salvaCampo('equipaggiamento', this.value)">${escapeHtml(dati.equipaggiamento)}</textarea></div>
            <div class="card"><h3>${L.traits}</h3><textarea rows="3" onchange="salvaCampo('tratti', this.value)">${escapeHtml(dati.tratti)}</textarea></div>
            <div class="card"><h3>${L.treasure}</h3><textarea rows="2" onchange="salvaCampo('tesoro', this.value)">${escapeHtml(dati.tesoro)}</textarea></div>
            <div class="card"><h3>${L.allies}</h3><textarea rows="2" onchange="salvaCampo('alleati', this.value)">${escapeHtml(dati.alleati)}</textarea></div>
            <div class="card"><h3>${L.notes}</h3><textarea rows="3" onchange="salvaCampo('note', this.value)">${escapeHtml(dati.note)}</textarea></div>

            <!-- LORE MODIFICABILE -->
            <div class="card">
                <h2>${L.lore}</h2>
                <div class="lore-box">
                    <div id="lore-testo" class="lore-text">${escapeHtml(lore).replace(/\n/g, '<br>')}</div>
                    <textarea id="lore-textarea" class="lore-textarea" rows="6">${escapeHtml(lore)}</textarea>
                    <button id="btn-modifica-lore" onclick="abilitaModificaLore()">✏️ Modifica Lore</button>
                    <button id="btn-salva-lore" style="display:none;" onclick="salvaLore()">💾 Salva Lore</button>
                </div>
            </div>
        `;
        document.getElementById("contenuto").innerHTML = html;
    }

    caricaDati();
</script>
</body>
</html>
