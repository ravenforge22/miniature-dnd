<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scheda Personaggio D&D - IL_TUO_SHOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2c2416;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #faf3e0;
            background-image: linear-gradient(to bottom, #fff8ed, #f2e6d5);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid #c9ae6e;
            overflow: hidden;
        }

        .shop-header {
            background: #2c1810;
            padding: 18px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
        }
        .shop-header h1 {
            color: #d4af37;
            font-size: 26px;
            letter-spacing: 2px;
            font-family: 'Georgia', serif;
        }
        .shop-header p {
            color: #c9ae6e;
            font-size: 11px;
            margin-top: 6px;
        }

        .lang-bar {
            text-align: right;
            padding: 12px 20px;
            background: #e8dccc;
            border-bottom: 1px solid #d4c4a8;
        }
        .lang-btn {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 5px 16px;
            margin: 0 3px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .lang-btn.active {
            background: #d4af37;
            color: #2c1810;
        }

        .sheet-content {
            padding: 25px;
        }

        .media-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4c4a8;
        }
        .char-img img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d4af37;
        }
        audio {
            width: 300px;
        }

        .card {
            background: #fffef7;
            border: 1px solid #d4c4a8;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .card h2 {
            color: #2c1810;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 18px;
            font-family: 'Georgia', serif;
        }
        .card h3 {
            color: #3a2a1a;
            margin: 12px 0 8px;
            font-size: 15px;
            border-left: 3px solid #d4af37;
            padding-left: 10px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 10px;
            align-items: baseline;
        }
        .form-row label {
            width: 140px;
            font-weight: bold;
            font-size: 13px;
            color: #2c1810;
        }
        .form-row input, .form-row textarea {
            flex: 1;
            background: #fefcf5;
            border: 1px solid #d4c4a8;
            border-radius: 6px;
            padding: 6px 10px;
            font-family: 'Georgia', serif;
            font-size: 13px;
        }
        .form-row textarea {
            resize: vertical;
        }

        /* Sezione caratteristiche a blocchi */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            margin: 15px 0;
        }
        .stat-block {
            flex: 1;
            text-align: center;
            background: #f3ecd9;
            border: 1px solid #c9ae6e;
            border-radius: 10px;
            padding: 8px;
            min-width: 80px;
        }
        .stat-block label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            color: #2c1810;
        }
        .stat-block input {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            width: 65px;
            margin: 5px auto 0;
            display: block;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 6px;
            padding: 4px;
        }
        .stat-mod {
            font-size: 11px;
            color: #6b4c3a;
            margin-top: 3px;
        }

        /* Due colonne per tiri salvezza e competenze */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .save-item, .skill-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .save-item label, .skill-item label {
            width: 130px;
            font-size: 12px;
            font-weight: bold;
        }
        .save-item input, .skill-item input {
            width: 50px;
            text-align: center;
            background: #fefcf5;
            border: 1px solid #c9ae6e;
            border-radius: 5px;
            padding: 4px;
        }

        button {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 6px 18px;
            margin: 5px 5px 0 0;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        button:hover {
            background: #d4af37;
            color: #2c1810;
        }

        .lore-box {
            background: #f3ecd9;
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
        }
        .lore-text {
            line-height: 1.5;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .lore-textarea {
            width: 100%;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 10px;
            padding: 12px;
            font-family: 'Georgia', serif;
            display: none;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #e8dccc;
            font-size: 10px;
            color: #5a4a3a;
            border-top: 1px solid #d4c4a8;
        }

        @media (max-width: 700px) {
            .stats-row { flex-wrap: wrap; }
            .two-columns { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; align-items: flex-start; }
            .form-row label { margin-bottom: 4px; }
            audio { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="shop-header">
        <h1>⚔️ Raven Forge ⚔️</h1>
        <p>|La tua avventura, le tue scelte|</p>
    </div>
    <div class="lang-bar">
        <button class="lang-btn" id="btn-ita" onclick="setLingua('it')">🇮🇹 Italiano</button>
        <button class="lang-btn" id="btn-eng" onclick="setLingua('en')">🇬🇧 English</button>
    </div>
    <div class="sheet-content" id="contenuto">
        <div style="text-align:center; padding:60px;">⏳ Caricamento personaggio...</div>
    </div>
    <div class="footer">
        🧙‍♂️ Tutti i dati si salvano automaticamente su questa miniatura
    </div>
</div>

<script>
    // ========================================
    // CONFIGURAZIONE - PERSONALIZZA QUI
    // ========================================
    const URL_BACKUP = "https://script.google.com/macros/s/AKfycbyApNde1N4X3gjURh67eZVjRGCMkJjoSUwFmPrguxbcoWuJGA1qDYfhzN_-lFQgrV2P/exec";
    const ID_MINIATURA = "personaggio_001";
    const FILE_IMMAGINE = "immagine.jpg";
    const FILE_AUDIO_ITA = "audio-ita.mp3";
    const FILE_AUDIO_ENG = "audio-eng.mp3";

    // DATI STANDARD DEL PERSONAGGIO
    const DATI_STANDARD = {
        lingua: "it",
        nome: "Nome",
        classe: "Classe",
        livello: "1",
        razza: "Razza",
        background: "Background",
        allineamento: "Neutrale",
        esperienza: "0",
        forza: "10",
        destrezza: "10",
        costituzione: "10",
        intelligenza: "10",
        saggezza: "10",
        carisma: "10",
        ts_forza: "0",
        ts_destrezza: "0",
        ts_costituzione: "0",
        ts_intelligenza: "0",
        ts_saggezza: "0",
        ts_carisma: "0",
        acrobazia: "0",
        addestrare_animali: "0",
        arcano: "0",
        atletica: "0",
        inganno: "0",
        storia: "0",
        intuizione: "0",
        intimidire: "0",
        indagare: "0",
        medicina: "0",
        natura: "0",
        percezione: "0",
        intrattenere: "0",
        persuasione: "0",
        religione: "0",
        rapidita_mano: "0",
        furtivita: "0",
        sopravvivenza: "0",
        pf_totali: "10",
        pf_attuali: "10",
        pf_temp: "0",
        dadi_vita: "1d8",
        ispirazione: "",
        prof_bonus: "2",
        attacchi: "",
        equipaggiamento: "",
        tratti: "",
        tesoro: "",
        alleati: "",
        note: "",
        occhi: "",
        eta: "",
        peso: "",
        altezza: "",
        capelli: "",
        carnagione: "",
        aspetto: "",
        lore_ita: "Scrivi qui la storia del tuo personaggio...",
        lore_eng: "Write your character's story here..."
    };

    // ETICHETTE BILINGUE
    const labels = {
        it: {
            name: "NOME PERSONAGGIO", class: "CLASSE", level: "LIVELLO", race: "RAZZA", bg: "BACKGROUND", align: "ALLINEAMENTO", exp: "PUNTI ESPERIENZA",
            str: "FORZA", dex: "DESTREZZA", con: "COSTITUZIONE", int: "INTELLIGENZA", wis: "SAGGEZZA", cha: "CARISMA",
            inspiration: "ISPIRAZIONE", prof: "BONUS PROF.", saves: "TIRO SALVEZZA", skills: "COMPETENZE",
            acrobazia: "Acrobazia (Des)", animali: "Addestrare Animali (Sag)", arcano: "Arcano (Int)", atletica: "Atletica (For)",
            inganno: "Inganno (Car)", storia: "Storia (Int)", intuizione: "Intuizione (Sag)", intimidire: "Intimidire (Car)",
            indagare: "Indagare (Int)", medicina: "Medicina (Sag)", natura: "Natura (Int)", percezione: "Percezione (Sag)",
            intrattenere: "Intrattenere (Car)", persuasione: "Persuasione (Car)", religione: "Religione (Int)",
            rapidita: "Rapidità di Mano (Des)", furtivita: "Furtività (Des)", sopravvivenza: "Sopravvivenza (Sag)",
            hp: "PUNTI FERITA", temp_hp: "PF TEMPORANEI", hit_dice: "DADI VITA",
            attacks: "ATTACCHI & INCANTESIMI", equipment: "EQUIPAGGIAMENTO", traits: "TRATTI & PRIVILEGI",
            treasure: "TESORO", allies: "ALLEATI & ORGANIZZAZIONI", notes: "NOTE",
            occhi: "OCCHI", eta: "ETÀ", peso: "PESO", altezza: "ALTEZZA", capelli: "CAPELLI", carnagione: "CARNAGIONE", aspetto: "ASPETTO",
            lore: "LORE / STORIA"
        },
        en: {
            name: "CHARACTER NAME", class: "CLASS", level: "LEVEL", race: "RACE", bg: "BACKGROUND", align: "ALIGNMENT", exp: "EXPERIENCE POINTS",
            str: "STRENGTH", dex: "DEXTERITY", con: "CONSTITUTION", int: "INTELLIGENCE", wis: "WISDOM", cha: "CHARISMA",
            inspiration: "INSPIRATION", prof: "PROFICIENCY BONUS", saves: "SAVING THROWS", skills: "SKILLS",
            acrobazia: "Acrobatics (Dex)", animali: "Animal Handling (Wis)", arcano: "Arcana (Int)", atletica: "Athletics (Str)",
            inganno: "Deception (Cha)", storia: "History (Int)", intuizione: "Insight (Wis)", intimidire: "Intimidation (Cha)",
            indagare: "Investigation (Int)", medicina: "Medicine (Wis)", natura: "Nature (Int)", percezione: "Perception (Wis)",
            intrattenere: "Performance (Cha)", persuasione: "Persuasion (Cha)", religione: "Religion (Int)",
            rapidita: "Sleight of Hand (Dex)", furtivita: "Stealth (Dex)", sopravvivenza: "Survival (Wis)",
            hp: "HIT POINTS", temp_hp: "TEMP HP", hit_dice: "HIT DICE",
            attacks: "ATTACKS & SPELLS", equipment: "EQUIPMENT", traits: "TRAITS & FEATURES",
            treasure: "TREASURE", allies: "ALLIES & ORGANIZATIONS", notes: "NOTES",
            occhi: "EYES", eta: "AGE", peso: "WEIGHT", altezza: "HEIGHT", capelli: "HAIR", carnagione: "SKIN", aspetto: "APPEARANCE",
            lore: "LORE / STORY"
        }
    };

    let dati = {};
    let linguaCorrente = "it";

    // FUNZIONI BACKUP
    async function salvaBackup() {
        try { await fetch(`${URL_BACKUP}?azione=backup&id=${ID_MINIATURA}&dati=${encodeURIComponent(JSON.stringify(dati))}`); } catch(e) {}
    }
    async function recuperaBackup() {
        try { const res = await fetch(`${URL_BACKUP}?azione=recupera&id=${ID_MINIATURA}`); const txt = await res.text(); if (txt && txt !== "nessun_backup") return JSON.parse(txt); } catch(e) {}
        return null;
    }
    function salvaLocale() { localStorage.setItem(`pg_${ID_MINIATURA}`, JSON.stringify(dati)); }
    async function salvaTutto() { salvaLocale(); await salvaBackup(); }
    async function salvaCampo(campo, valore) { dati[campo] = valore; await salvaTutto(); }

    async function caricaDati() {
        let locali = localStorage.getItem(`pg_${ID_MINIATURA}`);
        if (locali) {
            dati = JSON.parse(locali);
            linguaCorrente = dati.lingua || "it";
        } else {
            let backup = await recuperaBackup();
            if (backup) { dati = backup; linguaCorrente = dati.lingua || "it"; salvaLocale(); }
            else { dati = JSON.parse(JSON.stringify(DATI_STANDARD)); salvaLocale(); await salvaBackup(); }
        }
        disegnaPagina();
    }

    async function setLingua(lingua) { linguaCorrente = lingua; dati.lingua = lingua; await salvaTutto(); disegnaPagina(); }

    // LORE
    function abilitaModificaLore() {
        const testo = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;
        document.getElementById("lore-textarea").value = testo;
        document.getElementById("lore-textarea").style.display = "block";
        document.getElementById("lore-testo").style.display = "none";
        document.getElementById("btn-modifica-lore").style.display = "none";
        document.getElementById("btn-salva-lore").style.display = "inline-block";
    }
    async function salvaLore() {
        const nuovo = document.getElementById("lore-textarea").value;
        if (linguaCorrente === "it") dati.lore_ita = nuovo;
        else dati.lore_eng = nuovo;
        await salvaTutto();
        disegnaPagina();
    }

    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

    function calcolaMod(val) { return Math.floor((parseInt(val) - 10) / 2); }

    function disegnaPagina() {
        const L = labels[linguaCorrente];
        const lore = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;

        const stats = [
            { label: L.str, value: dati.forza, campo: "forza", mod: calcolaMod(dati.forza) },
            { label: L.dex, value: dati.destrezza, campo: "destrezza", mod: calcolaMod(dati.destrezza) },
            { label: L.con, value: dati.costituzione, campo: "costituzione", mod: calcolaMod(dati.costituzione) },
            { label: L.int, value: dati.intelligenza, campo: "intelligenza", mod: calcolaMod(dati.intelligenza) },
            { label: L.wis, value: dati.saggezza, campo: "saggezza", mod: calcolaMod(dati.saggezza) },
            { label: L.cha, value: dati.carisma, campo: "carisma", mod: calcolaMod(dati.carisma) }
        ];

        const html = `
            <div class="media-row">
                <div class="char-img"><img src="${FILE_IMMAGINE}" alt="Personaggio"></div>
                <audio controls><source src="${linguaCorrente === "it" ? FILE_AUDIO_ITA : FILE_AUDIO_ENG}" type="audio/mpeg"></audio>
            </div>

            <!-- NOME PERSONAGGIO e INFO PRINCIPALI -->
            <div class="card">
                <div class="form-row"><label>${L.name}:</label><input type="text" value="${escapeHtml(dati.nome)}" onchange="salvaCampo('nome', this.value)"></div>
                <div class="form-row"><label>${L.class}:</label><input type="text" value="${escapeHtml(dati.classe)}" onchange="salvaCampo('classe', this.value)" style="flex:0.4"><label style="width:auto; margin-left:10px;">${L.level}:</label><input type="text" value="${escapeHtml(dati.livello)}" onchange="salvaCampo('livello', this.value)" style="flex:0.2"></div>
                <div class="form-row"><label>${L.race}:</label><input type="text" value="${escapeHtml(dati.razza)}" onchange="salvaCampo('razza', this.value)"></div>
                <div class="form-row"><label>${L.bg}:</label><input type="text" value="${escapeHtml(dati.background)}" onchange="salvaCampo('background', this.value)"></div>
                <div class="form-row"><label>${L.align}:</label><input type="text" value="${escapeHtml(dati.allineamento)}" onchange="salvaCampo('allineamento', this.value)"></div>
                <div class="form-row"><label>${L.exp}:</label><input type="text" value="${escapeHtml(dati.esperienza)}" onchange="salvaCampo('esperienza', this.value)"></div>
            </div>

            <!-- CARATTERISTICHE (FORZA, DESTREZZA, ecc.) -->
            <div class="card">
                <div class="stats-row">
                    ${stats.map(s => `
                        <div class="stat-block">
                            <label>${s.label}</label>
                            <input type="number" value="${s.value}" onchange="salvaCampo('${s.campo}', this.value)">
                            <div class="stat-mod">(${s.mod >= 0 ? '+' : ''}${s.mod})</div>
                        </div>
                    `).join('')}
                </div>
                <div class="form-row"><label>${L.inspiration}:</label><input type="text" value="${escapeHtml(dati.ispirazione)}" onchange="salvaCampo('ispirazione', this.value)"></div>
                <div class="form-row"><label>${L.prof}:</label><input type="text" value="${escapeHtml(dati.prof_bonus)}" onchange="salvaCampo('prof_bonus', this.value)"></div>
            </div>

            <!-- DESCRIZIONE FISICA (OCCHI, ETA, PESO, ecc.) -->
            <div class="card">
                <div class="form-row"><label>${L.occhi}:</label><input type="text" value="${escapeHtml(dati.occhi)}" onchange="salvaCampo('occhi', this.value)"></div>
                <div class="form-row"><label>${L.eta}:</label><input type="text" value="${escapeHtml(dati.eta)}" onchange="salvaCampo('eta', this.value)"></div>
                <div class="form-row"><label>${L.peso}:</label><input type="text" value="${escapeHtml(dati.peso)}" onchange="salvaCampo('peso', this.value)"></div>
                <div class="form-row"><label>${L.altezza}:</label><input type="text" value="${escapeHtml(dati.altezza)}" onchange="salvaCampo('altezza', this.value)"></div>
                <div class="form-row"><label>${L.capelli}:</label><input type="text" value="${escapeHtml(dati.capelli)}" onchange="salvaCampo('capelli', this.value)"></div>
                <div class="form-row"><label>${L.carnagione}:</label><input type="text" value="${escapeHtml(dati.carnagione)}" onchange="salvaCampo('carnagione', this.value)"></div>
                <div class="form-row"><label>${L.aspetto}:</label><textarea rows="2" onchange="salvaCampo('aspetto', this.value)">${escapeHtml(dati.aspetto)}</textarea></div>
            </div>

            <!-- TIRO SALVEZZA E COMPETENZE -->
            <div class="card">
                <div class="two-columns">
                    <div>
                        <h3>${L.saves}</h3>
                        <div class="save-item"><label>${L.str}</label><input type="text" value="${dati.ts_forza}" onchange="salvaCampo('ts_forza', this.value)"></div>
                        <div class="save-item"><label>${L.dex}</label><input type="text" value="${dati.ts_destrezza}" onchange="salvaCampo('ts_destrezza', this.value)"></div>
                        <div class="save-item"><label>${L.con}</label><input type="text" value="${dati.ts_costituzione}" onchange="salvaCampo('ts_costituzione', this.value)"></div>
                        <div class="save-item"><label>${L.int}</label><input type="text" value="${dati.ts_intelligenza}" onchange="salvaCampo('ts_intelligenza', this.value)"></div>
                        <div class="save-item"><label>${L.wis}</label><input type="text" value="${dati.ts_saggezza}" onchange="salvaCampo('ts_saggezza', this.value)"></div>
                        <div class="save-item"><label>${L.cha}</label><input type="text" value="${dati.ts_carisma}" onchange="salvaCampo('ts_carisma', this.value)"></div>
                    </div>
                    <div>
                        <h3>${L.skills}</h3>
                        <div class="skill-item"><label>${L.acrobazia}</label><input type="text" value="${dati.acrobazia}" onchange="salvaCampo('acrobazia', this.value)"></div>
                        <div class="skill-item"><label>${L.animali}</label><input type="text" value="${dati.addestrare_animali}" onchange="salvaCampo('addestrare_animali', this.value)"></div>
                        <div class="skill-item"><label>${L.arcano}</label><input type="text" value="${dati.arcano}" onchange="salvaCampo('arcano', this.value)"></div>
                        <div class="skill-item"><label>${L.atletica}</label><input type="text" value="${dati.atletica}" onchange="salvaCampo('atletica', this.value)"></div>
                        <div class="skill-item"><label>${L.inganno}</label><input type="text" value="${dati.inganno}" onchange="salvaCampo('inganno', this.value)"></div>
                        <div class="skill-item"><label>${L.storia}</label><input type="text" value="${dati.storia}" onchange="salvaCampo('storia', this.value)"></div>
                        <div class="skill-item"><label>${L.intuizione}</label><input type="text" value="${dati.intuizione}" onchange="salvaCampo('intuizione', this.value)"></div>
                        <div class="skill-item"><label>${L.intimidire}</label><input type="text" value="${dati.intimidire}" onchange="salvaCampo('intimidire', this.value)"></div>
                        <div class="skill-item"><label>${L.indagare}</label><input type="text" value="${dati.indagare}" onchange="salvaCampo('indagare', this.value)"></div>
                        <div class="skill-item"><label>${L.medicina}</label><input type="text" value="${dati.medicina}" onchange="salvaCampo('medicina', this.value)"></div>
                        <div class="skill-item"><label>${L.natura}</label><input type="text" value="${dati.natura}" onchange="salvaCampo('natura', this.value)"></div>
                        <div class="skill-item"><label>${L.percezione}</label><input type="text" value="${dati.percezione}" onchange="salvaCampo('percezione', this.value)"></div>
                        <div class="skill-item"><label>${L.intrattenere}</label><input type="text" value="${dati.intrattenere}" onchange="salvaCampo('intrattenere', this.value)"></div>
                        <div class="skill-item"><label>${L.persuasione}</label><input type="text" value="${dati.persuasione}" onchange="salvaCampo('persuasione', this.value)"></div>
                        <div class="skill-item"><label>${L.religione}</label><input type="text" value="${dati.religione}" onchange="salvaCampo('religione', this.value)"></div>
                        <div class="skill-item"><label>${L.rapidita}</label><input type="text" value="${dati.rapidita_mano}" onchange="salvaCampo('rapidita_mano', this.value)"></div>
                        <div class="skill-item"><label>${L.furtivita}</label><input type="text" value="${dati.furtivita}" onchange="salvaCampo('furtivita', this.value)"></div>
                        <div class="skill-item"><label>${L.sopravvivenza}</label><input type="text" value="${dati.sopravvivenza}" onchange="salvaCampo('sopravvivenza', this.value)"></div>
                    </div>
                </div>
            </div>

            <!-- PUNTI FERITA -->
            <div class="card">
                <div class="form-row"><label>${L.hp} (totali):</label><input type="text" value="${escapeHtml(dati.pf_totali)}" onchange="salvaCampo('pf_totali', this.value)"></div>
                <div class="form-row"><label>${L.hp} (attuali):</label><input type="text" value="${escapeHtml(dati.pf_attuali)}" onchange="salvaCampo('pf_attuali', this.value)"></div>
                <div class="form-row"><label>${L.temp_hp}:</label><input type="text" value="${escapeHtml(dati.pf_temp)}" onchange="salvaCampo('pf_temp', this.value)"></div>
                <div class="form-row"><label>${L.hit_dice}:</label><input type="text" value="${escapeHtml(dati.dadi_vita)}" onchange="salvaCampo('dadi_vita', this.value)"></div>
            </div>

            <!-- ATTACCHI -->
            <div class="card">
                <h3>${L.attacks}</h3>
                <textarea rows="3" onchange="salvaCampo('attacchi', this.value)">${escapeHtml(dati.attacchi)}</textarea>
            </div>

            <!-- EQUIPAGGIAMENTO, TRATTI, TESORO, ALLEATI, NOTE -->
            <div class="card"><h3>${L.equipment}</h3><textarea rows="3" onchange="salvaCampo('equipaggiamento', this.value)">${escapeHtml(dati.equipaggiamento)}</textarea></div>
            <div class="card"><h3>${L.traits}</h3><textarea rows="3" onchange="salvaCampo('tratti', this.value)">${escapeHtml(dati.tratti)}</textarea></div>
            <div class="card"><h3>${L.treasure}</h3><textarea rows="2" onchange="salvaCampo('tesoro', this.value)">${escapeHtml(dati.tesoro)}</textarea></div>
            <div class="card"><h3>${L.allies}</h3><textarea rows="2" onchange="salvaCampo('alleati', this.value)">${escapeHtml(dati.alleati)}</textarea></div>
            <div class="card"><h3>${L.notes}</h3><textarea rows="3" onchange="salvaCampo('note', this.value)">${escapeHtml(dati.note)}</textarea></div>

            <!-- LORE MODIFICABILE -->
            <div class="card">
                <h2>${L.lore}</h2>
                <div class="lore-box">
                    <div id="lore-testo" class="lore-text">${escapeHtml(lore).replace(/\n/g, '<br>')}</div>
                    <textarea id="lore-textarea" class="lore-textarea" rows="6">${escapeHtml(lore)}</textarea>
                    <button id="btn-modifica-lore" onclick="abilitaModificaLore()">✏️ Modifica Lore</button>
                    <button id="btn-salva-lore" style="display:none;" onclick="salvaLore()">💾 Salva Lore</button>
                </div>
            </div>
        `;
        document.getElementById("contenuto").innerHTML = html;
    }

    caricaDati();
</script>
</body>
</html>
