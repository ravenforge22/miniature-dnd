<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scheda Personaggio - Raven Forge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        body {
            background: #1a1a2e;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #f9f3e2;
            background-image: linear-gradient(to bottom, #fff8ed, #f2e6d5);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 2px solid #d4af37;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container::before {
            content: "❧";
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 28px;
            color: #d4af37;
            opacity: 0.4;
            z-index: 1;
        }

        .container::after {
            content: "☙";
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 28px;
            color: #d4af37;
            opacity: 0.4;
            z-index: 1;
        }

        .shop-header {
            background: #2c1810;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
            position: relative;
            z-index: 2;
        }

        .shop-header img {
            max-height: 60px;
            margin-bottom: 10px;
        }

        .shop-header h1 {
            color: #d4af37;
            font-size: 26px;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #1a0f0a;
        }

        .shop-header p {
            color: #c9ae6e;
            font-size: 12px;
            margin-top: 8px;
        }

        .lang-bar {
            text-align: right;
            padding: 12px 20px;
            background: #e8dccc;
            border-bottom: 1px solid #d4c4a8;
            position: relative;
            z-index: 2;
        }

        .lang-btn {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 6px 18px;
            margin: 0 4px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 13px;
        }

        .lang-btn.active {
            background: #d4af37;
            color: #2c1810;
        }

        .content {
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .media-row {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4c4a8;
        }

        .char-img img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d4af37;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        audio {
            width: 320px;
            border-radius: 40px;
        }

        .stats-top {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            background: #2c1810;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            color: #f9f3e2;
        }

        .stat-block {
            text-align: center;
            flex: 1;
            min-width: 80px;
        }

        .stat-block label {
            font-size: 11px;
            color: #d4af37;
            display: block;
        }

        .stat-block input {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            background: #1a1a2e;
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 5px;
            width: 80px;
            color: #d4af37;
            font-family: inherit;
            margin-top: 5px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 12px;
            align-items: baseline;
            gap: 10px;
        }

        .form-row label {
            font-weight: bold;
            color: #3a2a1a;
            font-size: 14px;
            min-width: 90px;
        }

        .form-row input,
        .form-row textarea {
            flex: 1;
            background: #fefcf5;
            border: 1px solid #d4c4a8;
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'Georgia', serif;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 20px 0;
            border-bottom: 2px solid #d4c4a8;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: #e8dccc;
            color: #2c1810;
            border: none;
            padding: 10px 20px;
            border-radius: 30px 30px 0 0;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            font-size: 13px;
        }

        .tab-btn.active {
            background: #d4af37;
            color: #1a1a2e;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-pane.active {
            display: block;
        }

        .sheet-card {
            background: #fffef7;
            border: 1px solid #d4c4a8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .sheet-card h3 {
            color: #2c1810;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            margin-bottom: 18px;
            font-size: 18px;
        }

        .sheet-card textarea {
            width: 100%;
            background: #fefcf5;
            border: 1px solid #d4c4a8;
            border-radius: 8px;
            padding: 10px 12px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            resize: vertical;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin: 20px 0;
            text-align: center;
        }

        .stat-box {
            background: #f3ecd9;
            border: 1px solid #c9ae6e;
            border-radius: 12px;
            padding: 10px;
        }

        .stat-box label {
            font-size: 12px;
            font-weight: bold;
            display: block;
            color: #2c1810;
        }

        .stat-box input {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            width: 70px;
            margin: 8px auto 0;
            display: block;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 8px;
            padding: 5px;
            font-family: inherit;
        }

        .stat-box .mod {
            font-size: 12px;
            color: #d4af37;
            margin-top: 5px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 15px;
        }

        .skill-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-item label {
            width: 160px;
            font-size: 12px;
            font-weight: bold;
        }

        .skill-item input {
            width: 55px;
            text-align: center;
            background: #fefcf5;
            border: 1px solid #c9ae6e;
            border-radius: 6px;
            padding: 5px;
        }

        .lore-box {
            background: #f3ecd9;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
        }

        .lore-text {
            line-height: 1.6;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .lore-textarea {
            width: 100%;
            background: #fffef7;
            border: 1px solid #c9ae6e;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Georgia', serif;
            display: none;
            margin-bottom: 12px;
            min-height: 150px;
        }

        button {
            background: #2c1810;
            color: #d4af37;
            border: none;
            padding: 8px 22px;
            margin: 5px 5px 0 0;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        button:hover {
            background: #d4af37;
            color: #2c1810;
        }

        .footer {
            text-align: center;
            padding: 18px;
            background: #e8dccc;
            font-size: 11px;
            color: #5a4a3a;
            border-top: 1px solid #d4c4a8;
        }

        .sync-status {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: #2c1810;
            color: #d4af37;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 11px;
            font-family: 'Georgia', serif;
            border: 1px solid #d4af37;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 9999;
            pointer-events: none;
        }

        .sync-status.show {
            opacity: 1;
        }

        /* ============================================ */
        /* RESPONSIVE MOBILE                            */
        /* ============================================ */
        @media (max-width: 700px) {
            .content { padding: 15px; }

            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                margin: 15px 0;
            }

            .stat-box {
                padding: 4px 2px;
                border-radius: 8px;
                min-width: 0;
            }

            .stat-box label {
                font-size: 9px;
                letter-spacing: -0.3px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .stat-box input {
                width: 50px;
                font-size: 16px;
                padding: 2px;
                margin: 2px auto 0;
            }

            .stat-box .mod {
                font-size: 8px;
                margin-top: 1px;
            }

            .form-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-row label {
                margin-bottom: 5px;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }

            audio { width: 100%; }

            .tabs { justify-content: center; }

            .skill-item { flex-wrap: wrap; }

            .skill-item label { width: 100%; }

            .form-row input,
            .form-row textarea,
            .skill-item input,
            .stats-top input,
            .stat-box input,
            .sheet-card textarea {
                max-width: 100%;
                width: 100%;
            }

            .stats-top .stat-block input {
                width: 70px;
            }
        }
    </style>
</head>

    // ========================================
    // CALCOLO MODIFICATORE (D&D 5e)
    // ========================================
    function calcolaMod(punteggio) {
        const val = parseInt(punteggio, 10);
        if (isNaN(val)) return 0;
        return Math.floor((val - 10) / 2);
    }

    // ========================================
    // INDICATORE DI STATO
    // ========================================
    function mostraStato(testo, durata = 1500) {
        const el = document.getElementById("sync-status");
        if (!el) return;
        el.textContent = testo;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), durata);
    }

    // ========================================
    // JSONP
    // ========================================
    function jsonpRequest(url, callbackName, onSuccess, onError) {
        const script = document.createElement('script');
        const callbackFunction = `jsonp_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;

        window[callbackFunction] = function(data) {
            delete window[callbackFunction];
            if (script.parentNode) document.body.removeChild(script);
            onSuccess(data);
        };

        const separator = url.includes('?') ? '&' : '?';
        script.src = `${url}${separator}callback=${callbackFunction}`;
        script.onerror = () => {
            delete window[callbackFunction];
            if (script.parentNode) document.body.removeChild(script);
            if (onError) onError();
        };

        document.body.appendChild(script);
    }

    // ========================================
    // BACKUP
    // ========================================
    async function salvaBackup() {
        if (URL_BACKUP.includes("IL_TUO_SCRIPT_ID")) return;
        dati._ultimaModifica = Date.now();
        const daSalvare = { ...dati };
        const url = `${URL_BACKUP}?azione=backup&id=${ID_MINIATURA}&dati=${encodeURIComponent(JSON.stringify(daSalvare))}`;

        return new Promise((resolve) => {
            jsonpRequest(url, 'callback', (data) => {
                console.log("Backup risultato:", data);
                mostraStato("✅ Salvato sul server");
                resolve();
            }, () => {
                console.log("Errore backup");
                mostraStato("⚠️ Offline - salvato solo in locale");
                resolve();
            });
        });
    }

    async function recuperaBackup() {
        if (URL_BACKUP.includes("IL_TUO_SCRIPT_ID")) return null;
        const url = `${URL_BACKUP}?azione=recupera&id=${ID_MINIATURA}`;

        return new Promise((resolve) => {
            jsonpRequest(url, 'callback', (data) => {
                if (data && data.status !== "nessun_backup" && data.status !== "error") {
                    resolve(data);
                } else {
                    resolve(null);
                }
            }, () => {
                resolve(null);
            });
        });
    }

    function salvaLocale() {
        try {
            localStorage.setItem(`pg_${ID_MINIATURA}`, JSON.stringify(dati));
        } catch (e) {
            console.warn("Impossibile salvare in localStorage:", e);
        }
    }

    let backupTimer = null;
    function pianificaBackup() {
        if (backupTimer) clearTimeout(backupTimer);
        mostraStato("💾 Salvataggio...", 2000);
        backupTimer = setTimeout(() => {
            salvaBackup();
        }, 1200);
    }

    function salvaTutto() {
        salvaLocale();
        pianificaBackup();
    }

    function salvaCampo(campo, valore) {
        dati[campo] = valore;
        salvaTutto();
    }

        dati[campo] = valore;
        salvaTutto();

            carisma: 'mod-carisma'
        };
        for (const [campo, idEl] of Object.entries(mappa)) {
            const el = document.getElementById(idEl);
            if (el) {
                const m = calcolaMod(dati[campo]);
                el.textContent = `(${m >= 0 ? '+' : ''}${m})`;
            }
        }
    }

    async function setLingua(lingua) {
        linguaCorrente = lingua;
        dati.lingua = lingua;
        salvaTutto();
        disegnaPagina();
    }

    function switchTab(tabId) {
        const panes = document.querySelectorAll('.tab-pane');
        const btns = document.querySelectorAll('.tab-btn');
        panes.forEach(pane => pane.classList.remove('active'));
        btns.forEach(btn => btn.classList.remove('active'));
        const targetPane = document.getElementById(`tab-${tabId}`);
        const targetBtn = document.getElementById(`btn-${tabId}`);
        if (targetPane) targetPane.classList.add('active');
        if (targetBtn) targetBtn.classList.add('active');
    }

    function abilitaModificaLore() {
        const testo = linguaCorrente === "it" ? dati.lore_ita : dati.lore_eng;
        const textarea = document.getElementById("lore-textarea");
        const loreTesto = document.getElementById("lore-testo");
        const btnMod = document.getElementById("btn-modifica-lore");
        const btnSalva = document.getElementById("btn-salva-lore");
        if (textarea) {
            textarea.value = testo;
            textarea.style.display = "block";
        }
        if (loreTesto) loreTesto.style.display = "none";
        if (btnMod) btnMod.style.display = "none";
        if (btnSalva) btnSalva.style.display = "inline-block";
    }

    function salvaLore() {
        const textarea = document.getElementById("lore-textarea");
        if (!textarea) return;
        const nuovo = textarea.value;
        if (linguaCorrente === "it") {
            dati.lore_ita = nuovo;
        } else {
            dati.lore_eng = nuovo;
        }
        salvaTutto();
        disegnaPagina();
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    // ========================================
    // CARICAMENTO CON SINCRONIZZAZIONE
    // ========================================
    async function caricaDati() {
        try {
            const backup = await recuperaBackup();
            const localiRaw = localStorage.getItem(`pg_${ID_MINIATURA}`);
            const datiLocali = localiRaw ? JSON.parse(localiRaw) : null;

            if (backup && datiLocali) {
                const t_backup = backup._ultimaModifica || 0;
                const t_locali = datiLocali._ultimaModifica || 0;
                if (t_backup >= t_locali) {
                    dati = backup;
                    console.log("✅ Caricato dal BACKUP (più recente)");
                } else {
                    dati = datiLocali;
                    console.log("✅ Caricato dal LOCALE (più recente del backup)");
                    await salvaBackup();
                }
            } else if (backup) {
                dati = backup;
                console.log("✅ Caricato dal BACKUP");
            } else if (datiLocali) {
                dati = datiLocali;
                console.log("✅ Caricato dal LOCALE (backup non disponibile)");
            } else {
                dati = JSON.parse(JSON.stringify(DATI_STANDARD));
                console.log("🆕 Primo avvio: dati standard");
                await salvaBackup();
            }

            linguaCorrente = dati.lingua || "it";
            salvaLocale();
            disegnaPagina();

        } catch (e) {
            console.log("Errore caricamento:", e);
            const contenuto = document.getElementById("contenuto");
            if (contenuto) {
                contenuto.innerHTML = '<div style="text-align:center; padding:60px; color:red;">❌ Errore nel caricamento. Ricarica la pagina.</div>';
            }
        }
    }

    // ========================================
    // SINCRONIZZAZIONE AUTOMATICA AL RITORNO
    // ========================================
    document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState !== 'visible') return;
        if (sincronizzazioneInCorso) return;
        sincronizzazioneInCorso = true;
        try {
            const backup = await recuperaBackup();
            if (backup) {
                const t_backup = backup._ultimaModifica || 0;
                const t_locale = dati._ultimaModifica || 0;
                if (t_backup > t_locale) {
                    console.log("🔄 Aggiornamento dal server...");
                    dati = backup;
                    linguaCorrente = dati.lingua || "it";
                    salvaLocale();
                    disegnaPagina();
                    mostraStato("🔄 Sincronizzato dal server");
                }
            }
        } catch (e) {
            console.warn("Errore sync:", e);
        } finally {
            sincronizzazioneInCorso = false;
        }
    });

    window.setLingua = setLingua;
    window.switchTab = switchTab;
    window.abilitaModificaLore = abilitaModificaLore;
    window.salvaLore = salvaLore;
    window.salvaCampo = salvaCampo;
    window.salvaCaratteristica = salvaCaratteristica;

    caricaDati();
</script>
